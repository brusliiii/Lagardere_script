name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build.yml"
      - "desktop_app.py"
      - "requirements.txt"
      - "icon.png"
      - "icon.ico"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create icon.ico if missing
        shell: bash
        run: |
          if [ ! -f "icon.ico" ]; then
            python - <<'PY'
from PIL import Image
img = Image.open("icon.png")
img.save("icon.ico", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
print("Created icon.ico")
PY
          fi

      - name: Build EXE (onefile)
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "Lagardere" --icon icon.ico desktop_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lagardere-windows-exe
          path: dist/Lagardere.exe
